---
version: '2'
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - prealloc
    - predeclared
    - revive
    - testpackage
    - wastedassign
    - whitespace
  settings:
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: Read the environment only in internal/config.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (^|/)internal/(config|logging)/
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
