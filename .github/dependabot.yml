---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - task
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - task
      - dependencies
    cooldown:
      default-days: 3
    groups:
      actions-patch-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - task
      - dependencies
    cooldown:
      default-days: 3
    ignore:
      # Go minor versions move with .tool-versions and go.mod.
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
